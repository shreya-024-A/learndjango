<!DOCTYPE html>
<html>
<head>
    <title>Select Seats</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background:#f5f5f5;
        }

        .screen{
            width:500px;
            background:#777;
            color:white;
            padding:15px;
            text-align:center;
            margin:30px auto;
            border-radius:5px;
            font-weight:bold;
            font-size:18px;
        }

        .legend{
            margin-bottom:25px;
        }

        .legend span{
            display:inline-block;
            padding:8px 15px;
            margin:5px;
            color:white;
            border-radius:5px;
        }

        .available-legend{
            background:green;
        }

        .booked-legend{
            background:red;
        }

        .selected-legend{
            background:blue;
        }

        .row{
            margin:12px 0;
        }

        .row-name{
            display:inline-block;
            width:40px;
            font-weight:bold;
        }

        .seat{
            display:inline-block;
            margin:4px;
        }

        .seat input{
            display:none;
        }

        .seat-box{
            width:45px;
            height:45px;
            display:flex;
            justify-content:center;
            align-items:center;
            border-radius:6px;
            color:white;
            font-size:12px;
            font-weight:bold;
            cursor:pointer;
        }

        .available{
            background:green;
        }

        .booked{
            background:red;
            cursor:not-allowed;
        }

        .seat input:checked + .seat-box{
            background:blue;
        }

        button{
            margin-top:25px;
            padding:12px 25px;
            font-size:16px;
            cursor:pointer;
        }

    </style>
</head>

<body>

<h1>Select Seats</h1>

<div class="screen">
    SCREEN
</div>

<div class="legend">
    <span class="available-legend">Available</span>
    <span class="booked-legend">Booked</span>
    <span class="selected-legend">Selected</span>
</div>

<form method="POST">
    {% csrf_token %}

    {% for row,seats in seat_rows.items %}

    <div class="row">

       

        {% for seat in seats %}

            {% if seat.is_booked %}

                <span class="seat">
                    <span class="seat-box booked">
                        {{ seat.seat_number }}
                    </span>
                </span>

            {% else %}

                <label class="seat">

                    <input
                        type="checkbox"
                        name="seats"
                        value="{{ seat.id }}"
                    >

                    <span class="seat-box available">
                        {{ seat.seat_number }}
                    </span>

                </label>

            {% endif %}

        {% endfor %}

    </div>

    {% endfor %}

    <br>

    <button type="submit">
        Book Selected Seats
    </button>

</form>

</body>
</html>
