<!DOCTYPE html>
<html>
<head>
    <title>Movies</title>
</head>
<body>

    <h1>Available Movies</h1>

    {% for movie in movies %}

        {%if movie.poster%}
            <img src="{{ movie.poster.url }} " width="200">
        {% endif %}
        <a href="{% url 'movie_detail' movie.id %}">
            <h2>{{ movie.title }}</h2>
        </a>

        <p>Language: {{ movie.language }}</p>

        <p>Duration: {{ movie.duration }} minutes</p>

        <p>Rating: {{ movie.rating }}/5</p>

        <hr>

    {% endfor %}

</body>
</html>
